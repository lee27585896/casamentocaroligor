<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Presentes — Carol & Igor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8D5A3;
      --gold-dark: #A07830;
      --white: #FDFBF7;
      --cream: #F5F0E8;
      --dark: #2C2416;
      --gray: #7A7060;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; background: var(--white); color: var(--dark); }

    /* HEADER */
    .page-header {
      background: var(--cream);
      text-align: center;
      padding: 80px 20px 60px;
      border-bottom: 1px solid var(--gold-light);
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--gold); text-decoration: none;
      margin-bottom: 40px;
    }
    .back-link:hover { color: var(--gold-dark); }
    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 300;
      color: var(--dark);
      margin-bottom: 12px;
    }
    .page-title em { font-style: italic; color: var(--gold-dark); }
    .page-subtitle {
      font-size: 14px;
      color: var(--gray);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.8;
    }
    .ornament {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 24px 0;
    }
    .ornament span { display: block; height: 1px; width: 60px; background: var(--gold-light); }
    .ornament svg { color: var(--gold); width: 16px; height: 16px; }

    /* GRID */
    .gifts-section { padding: 60px 20px 100px; max-width: 1100px; margin: 0 auto; }
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }
    .gift-card {
      background: white;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 4px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      display: flex; flex-direction: column;
    }
    .gift-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(44,36,22,0.1); }
    .gift-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: contain;
      background: var(--cream);
      padding: 20px;
    }
    .gift-img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }
    .gift-body { padding: 20px 22px 22px; flex: 1; display: flex; flex-direction: column; }
    .gift-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .gift-desc { font-size: 13px; color: var(--gray); margin-bottom: 12px; line-height: 1.6; }
    .gift-price {
      font-size: 12px;
      color: var(--gold-dark);
      letter-spacing: 0.05em;
      margin-bottom: auto;
      padding-bottom: 16px;
    }
    .gift-btn {
      display: block;
      width: 100%;
      background: var(--gold);
      color: white;
      border: none;
      padding: 12px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      margin-top: 16px;
      transition: background 0.3s;
      text-align: center;
      text-decoration: none;
    }
    .gift-btn:hover { background: var(--gold-dark); }
    .gift-btn.reserved {
      background: #ccc;
      cursor: default;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: rgba(44,36,22,0.6);
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      max-width: 440px; width: 100%;
      padding: 40px;
      border-radius: 4px;
      text-align: center;
    }
    .modal h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 300;
      color: var(--dark); margin-bottom: 8px;
    }
    .modal p { font-size: 13px; color: var(--gray); margin-bottom: 24px; line-height: 1.7; }
    .modal-btns { display: flex; gap: 12px; flex-direction: column; }
    .modal-btn-primary {
      background: var(--gold); color: white;
      border: none; padding: 14px;
      font-family: 'Jost', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
      transition: background 0.3s;
    }
    .modal-btn-primary:hover { background: var(--gold-dark); }
    .modal-btn-close {
      background: transparent; color: var(--gray);
      border: 1px solid var(--gold-light); padding: 12px;
      font-family: 'Jost', sans-serif;
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px;
    }

    footer {
      background: var(--dark); color: rgba(255,255,255,0.4);
      text-align: center; padding: 28px;
      font-size: 11px; letter-spacing: 0.15em;
    }
    footer a { color: var(--gold-light); text-decoration: none; }

    @media (max-width: 640px) {
      .page-header {
        padding: 50px 16px 40px;
      }
      .page-title {
        font-size: 38px;
      }
      .gifts-section {
        padding: 36px 16px 70px;
      }
      .gifts-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .modal {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
      Voltar ao site
    </a>
    <h1 class="page-title">Lista de <em>Presentes</em></h1>
    <div class="ornament">
      <span></span>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span></span>
    </div>
    <p class="page-subtitle">
      Cada presente é uma forma de celebrar esse momento com a gente.
      Escolha com carinho — qualquer gesto já nos faz muito felizes. 💛
    </p>
  </div>

  <div class="gifts-section">
    <div class="gifts-grid" id="giftsGrid">
      <!-- Gerado por JS -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalNome">Presente</h3>
      <p id="modalDesc">Você está reservando este presente para Carol & Igor.</p>
      <div class="modal-btns">
        <button class="modal-btn-primary" onclick="confirmarPresente()">✓ Reservar este presente</button>
        <button class="modal-btn-close" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <footer>
    <p><a href="index.html">← Carol & Igor · 20.03.2027</a></p>
  </footer>

  <script>
    const presents = [
      { id:1,  emoji:'🍳', nome:'Conjunto de Panelas',        desc:'Kit completo para começar a cozinhar juntos.',             preco:'~R$ 370' },
      { id:2,  emoji:'🛁', nome:'Jogo de Toalhas',            desc:'Jogo completo de banho e rosto, casal.',                   preco:'~R$ 170' },
      { id:3,  emoji:'🛏️', nome:'Edredom Casal',              desc:'Edredom dupla face, queen size, para o novo lar.',         preco:'~R$ 320' },
      { id:4,  emoji:'🛏️', nome:'Jogo de Lençol',             desc:'Jogo de lençol queen size, 400 fios.',                    preco:'~R$ 200' },
      { id:5,  emoji:'☕', nome:'Cafeteira',                   desc:'Para o café da manhã do casal.',                          preco:'~R$ 200' },
      { id:6,  emoji:'🍟', nome:'Air Fryer',                   desc:'Fritura saudável para o dia a dia.',                      preco:'~R$ 300' },
      { id:7,  emoji:'🌪️', nome:'Liquidificador',             desc:'Para sucos, vitaminas e receitas.',                       preco:'~R$ 150' },
      { id:8,  emoji:'♨️', nome:'Micro-ondas',                 desc:'Essencial para o cotidiano do lar.',                      preco:'~R$ 400' },
      { id:9,  emoji:'🧹', nome:'Aspirador de Pó',            desc:'Para manter o lar sempre limpo.',                         preco:'~R$ 250' },
      { id:10, emoji:'🔌', nome:'Kit Organizadores de Cozinha',desc:'Potes herméticos e organizadores para despensa.',         preco:'~R$ 130' },
      { id:11, emoji:'🪑', nome:'Tapete para Sala',            desc:'Tapete decorativo para a sala de estar.',                 preco:'~R$ 280' },
      { id:12, emoji:'💡', nome:'Kit Luminárias',              desc:'Luminárias para criar um ambiente aconchegante.',          preco:'~R$ 220' },
    ];

    let selectedId = null;

    function loadReserved() {
      return JSON.parse(localStorage.getItem('carolIgorReserved') || '[]');
    }

    function renderGifts() {
      const reserved = loadReserved();
      const grid = document.getElementById('giftsGrid');
      grid.innerHTML = presents.map(p => {
        const isReserved = reserved.includes(p.id);
        return `
          <div class="gift-card">
            <div class="gift-img-placeholder">${p.emoji}</div>
            <div class="gift-body">
              <h3 class="gift-name">${p.nome}</h3>
              <p class="gift-desc">${p.desc}</p>
              <p class="gift-price">Valor aproximado: ${p.preco}</p>
              ${isReserved
                ? '<span class="gift-btn reserved">✓ Reservado</span>'
                : `<button class="gift-btn" onclick="abrirModal(${p.id})">🎁 Quero presentear</button>`
              }
            </div>
          </div>`;
      }).join('');
    }

    function abrirModal(id) {
      const p = presents.find(x => x.id === id);
      selectedId = id;
      document.getElementById('modalNome').textContent = p.nome;
      document.getElementById('modalDesc').textContent = `Ao reservar, este item ficará marcado como escolhido. Preço aproximado: ${p.preco}.`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      selectedId = null;
    }

    function confirmarPresente() {
      if (!selectedId) return;
      const reserved = loadReserved();
      reserved.push(selectedId);
      localStorage.setItem('carolIgorReserved', JSON.stringify(reserved));
      fecharModal();
      renderGifts();
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) fecharModal();
    });

    renderGifts();
  </script>
</body>
</html>
